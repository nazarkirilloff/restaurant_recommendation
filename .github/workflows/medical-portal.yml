name: medical-portal

on:
  push:
    paths:
      - "medical-portal/**"
      - ".github/workflows/medical-portal.yml"
      - ".gitignore"
  pull_request:
    paths:
      - "medical-portal/**"
      - ".github/workflows/medical-portal.yml"
      - ".gitignore"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medical-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: medical-portal/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (UTC)
        run: npm test

      # Lab dates are calendar days; catch off-by-one-day bugs west and east of UTC.
      - name: Tests (UTC−8)
        run: npm test
        env:
          TZ: America/Los_Angeles

      - name: Tests (UTC+14)
        run: npm test
        env:
          TZ: Pacific/Kiritimati

      # Also verifies the built page: strict CSP, no network code (scripts/check-dist.mjs).
      - name: Build single-file HTML
        run: npm run build

      - name: Install Chromium for browser tests
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      # Hostile files, exfiltration attempts, and the encrypted on-device copy,
      # against the real built page.
      - name: Browser security tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: lab-results-portal
          path: medical-portal/dist/index.html
          if-no-files-found: error
